<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="img/monograma.png">
<title>Emerson Durães — Cartão virtual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--navy:#082343;--deep:#041329;--gold:#c8a35e;--light:#ecd69a;--ivory:#f5f0e6}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;background:var(--deep) radial-gradient(ellipse at 50% 30%,#0d3260 0,var(--deep) 70%);color:var(--ivory);font-family:Jost,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--light);outline-offset:4px}
/* envelope */
#env{position:fixed;inset:0;z-index:5;transition:visibility 0s 1.3s}
.flap{position:absolute;left:0;right:0;height:50%;background:var(--navy);transition:transform 1.1s cubic-bezier(.75,0,.2,1) .15s}
.flap.t{top:0;background:linear-gradient(#061c37,#0a2a50);border-bottom:1px solid var(--gold)}
.flap.b{bottom:0;background:linear-gradient(#0a2a50,#061c37);border-top:1px solid var(--gold)}
.opened #env{visibility:hidden}
.opened .flap.t{transform:translateY(-101%)}.opened .flap.b{transform:translateY(101%)}
#seal{position:absolute;left:50%;top:50%;width:min(66vw,270px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 28%,#123b6c,#061a34 72%);box-shadow:0 20px 60px #0009,inset 0 0 30px #0008;transition:opacity .35s,transform .45s}
.opened #seal{opacity:0;transform:translate(-50%,-50%) scale(1.25)}
#seal svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#seal circle{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.8s ease forwards}
#seal circle+circle{stroke-width:.35;animation-delay:.4s}
#seal img{position:absolute;left:11%;top:15%;width:78%;-webkit-mask:conic-gradient(#000 var(--a),transparent 0);mask:conic-gradient(#000 var(--a),transparent 0);animation:reveal 2s .5s ease-in-out forwards}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes reveal{to{--a:360deg}}
@keyframes draw{to{stroke-dashoffset:0}}
#hint{position:absolute;left:0;right:0;top:calc(50% + min(33vw,135px) + 30px);text-align:center;letter-spacing:.3em;font-size:.74rem;text-transform:uppercase;color:var(--light);opacity:0;animation:show 1s 2.4s forwards;transition:visibility .1s;pointer-events:none}
.opened #hint{visibility:hidden}
@keyframes show{to{opacity:1}}
/* cartão */
main{max-width:520px;margin:0 auto;padding:36px 18px 44px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px}
.scene{perspective:1200px}
#tilt{transform-style:preserve-3d;transition:transform .2s ease-out}
#card{display:block;position:relative;width:100%;aspect-ratio:9/5;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.1,.2,1);container-type:inline-size;text-align:left}
#card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 45px #0008}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x,25%) var(--y,15%),#fff6d24d,transparent 48%);mix-blend-mode:soft-light}
.front{background:var(--navy);border:1px solid #c8a35e66}
.front::before{content:"";position:absolute;left:0;right:0;top:7%;bottom:7%;border-block:1px solid var(--gold)}
.front img{position:absolute;left:16%;top:13%;width:68%}
.back{background:var(--ivory);color:var(--navy);transform:rotateY(180deg)}
.back .stripe{position:absolute;top:0;bottom:0;right:0;width:22%;background:var(--navy);border-left:2px solid var(--gold)}
.back .badge{position:absolute;right:9%;top:50%;translate:0 -50%;width:25%;aspect-ratio:1;border-radius:50%;background:var(--navy);border:2px solid var(--gold);display:grid;place-items:center}
.badge img{width:82%}
.who{position:absolute;left:7%;top:30%;width:56%}
.who img{width:100%;display:block}
.who p{font-size:4cqw;margin-top:1.5cqw}
.who i{display:block;width:12cqw;height:2px;background:var(--gold);margin-top:3.5cqw}
.who small{display:block;font-size:2.7cqw;letter-spacing:.2em;margin-top:3cqw}
.turn{text-align:center;font-size:.8rem;color:#b9c4d6}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.save{padding:15px;border-radius:40px;background:linear-gradient(110deg,#b28b45,var(--light),#b28b45);color:var(--deep);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:.84rem}
nav{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;min-height:58px;padding:9px 14px;border:1px solid #c8a35e55;border-radius:14px;background:#ffffff08;text-align:left;width:100%}
.row:hover{border-color:var(--light);background:#ffffff12}
.row svg{flex:none;width:24px;height:24px;fill:none;stroke:var(--light);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block;font-weight:500;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--light)}
.row span{font-size:.95rem;overflow-wrap:anywhere}
#qr{background:var(--ivory);color:var(--navy);border-radius:16px;padding:18px;text-align:center}
#qr svg{width:min(100%,260px);display:block;margin:0 auto 10px}
#msg{text-align:center;font-size:.85rem;color:var(--light);min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}}
.glint{position:absolute;pointer-events:none;background:linear-gradient(105deg,transparent 42%,#fff9e0 50%,transparent 58%) no-repeat;background-size:250% 100%;background-position:130% 0;-webkit-mask-size:100% 100%;mask-size:100% 100%;animation:glint 4.5s 2.6s ease-in-out infinite}
@keyframes glint{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}
@media (prefers-reduced-motion:reduce){.glint{display:none}}
</style>
</head>
